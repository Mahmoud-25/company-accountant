<head>

<style>
  /* ------------------------------------------------------------ tokens
     A full palette of our own, so the page looks deliberate in a plain
     browser. Telegram's theme variables override only the few surfaces
     that must match the client when it runs as a Mini App. */
  :root {
    color-scheme: light dark;
    --bg:        #eef1f7;
    --surface:   #ffffff;
    --surface-2: #f6f8fc;
    --line:      #e4e9f2;
    --line-soft: #eef2f8;
    --ink:       #0f172a;
    --ink-2:     #475569;
    --muted:     #93a1b5;
    --brand:     #2f7de1;
    --brand-2:   #5b9bf0;
    --on-brand:  #ffffff;
    --pos:       #0e9f6e;
    --neg:       #e02424;
    --pending:   #3b82f6;
    --stripe:    #8b5cf6;
    --bank:      #0e9f6e;
    --paid:      #7c8899;
    --shadow:    0 1px 2px rgba(15,23,42,.05), 0 10px 24px -16px rgba(15,23,42,.28);
    --shadow-lg: 0 2px 4px rgba(15,23,42,.06), 0 18px 40px -20px rgba(15,23,42,.40);
    --r: 16px;
    --r-sm: 11px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0f1319;
      --surface:   #171c24;
      --surface-2: #1d232c;
      --line:      #262e3a;
      --line-soft: #202730;
      --ink:       #e8edf4;
      --ink-2:     #a9b6c7;
      --muted:     #75839a;
      --brand:     #4b90ea;
      --brand-2:   #6ba6f2;
      --pos:       #34d399;
      --neg:       #f87171;
      --pending:   #60a5fa;
      --stripe:    #a78bfa;
      --bank:      #34d399;
      --paid:      #8b98ab;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 10px 24px -16px rgba(0,0,0,.7);
      --shadow-lg: 0 2px 6px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.8);
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background: var(--tg-theme-bg-color, var(--bg));
    color: var(--tg-theme-text-color, var(--ink));
    padding:14px 13px 72px;
    min-height:100vh;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  body[dir="rtl"] { text-align:right; }
  body[dir="ltr"] { text-align:left; }
  .container { max-width:760px; margin:0 auto; }

  /* numbers always read left to right, and line up in columns */
  .num {
    direction:ltr; unicode-bidi:embed; display:inline-block;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  }

  /* ------------------------------------------------------------ header */
  .header-top {
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; margin-bottom:16px;
  }
  h1 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .who-am-i { font-size:12px; color:var(--muted); font-weight:600; margin-top:1px; }
  .lang-switch {
    background:var(--surface); color:var(--ink-2);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 15px; font-family:inherit; font-size:12px; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); transition:.15s;
  }
  .lang-switch:active { transform:scale(.95); }

  /* ------------------------------------------------------------- tabs */
  .tabs {
    display:flex; gap:4px; margin-bottom:18px; padding:4px;
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:14px;
  }
  .tab {
    flex:1; text-align:center; padding:9px 6px; border-radius:10px;
    font-size:13.5px; font-weight:700; cursor:pointer; color:var(--muted);
    transition:.18s;
  }
  .tab:active { transform:scale(.98); }
  .tab.on {
    background:var(--surface); color:var(--ink);
    box-shadow:0 1px 3px rgba(15,23,42,.10);
  }

  /* ------------------------------------------------------------ cards */
  .card {
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    border:1px solid var(--line);
    border-radius:var(--r); padding:16px 17px; margin-bottom:11px;
    box-shadow:var(--shadow);
  }

  /* the headline: who pays whom */
  .settle {
    position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
    color:var(--on-brand);
    border-radius:var(--r); padding:20px 22px; margin-bottom:11px;
    box-shadow:var(--shadow-lg);
  }
  .settle::after {
    content:""; position:absolute; inset:auto -30px -60px auto;
    width:170px; height:170px; border-radius:50%;
    background:rgba(255,255,255,.10);
  }
  .settle .who { font-size:13.5px; font-weight:600; opacity:.92; }
  .settle .amt { font-size:33px; font-weight:900; letter-spacing:-.025em; margin-top:1px; }
  .settle.none {
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .settle.none::after { display:none; }
  .settle.none .amt { font-size:19px; font-weight:800; }
  .settle.none .who { color:var(--muted); }

  /* ------------------------------------------------------ stage cards */
  .stage-card { position:relative; overflow:hidden; }
  .stage-card::before {
    content:""; position:absolute; top:0; right:0; width:3px; height:100%;
  }
  body[dir="rtl"] .stage-card::before { right:auto; left:0; }
  .stage-card.pending::before { background:var(--pending); }
  .stage-card.stripe::before  { background:var(--stripe); }
  .stage-card.bank::before    { background:var(--bank); }
  .stage-card.paid::before    { background:var(--paid); }
  .stage-card.empty { opacity:.62; box-shadow:none; }

  .st-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .st-name { font-weight:800; font-size:16px; letter-spacing:-.01em; }
  .st-total { font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .st-meta { font-size:12px; color:var(--muted); margin-top:6px; font-weight:600; }

  .track {
    height:5px; background:var(--line-soft); border-radius:999px;
    margin-top:10px; overflow:hidden;
  }
  .fill {
    height:100%; border-radius:999px; background:var(--pending);
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .fill.ready { background:var(--bank); }

  .st-net {
    margin-top:13px; padding-top:12px; border-top:1px solid var(--line-soft);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:14px; font-weight:700;
  }
  .toggle {
    background:none; border:none; cursor:pointer; font-family:inherit;
    font-size:12px; font-weight:700; color:var(--brand); padding:3px 6px;
    border-radius:8px;
  }
  .toggle:active { background:var(--line-soft); }
  .detail { display:none; margin-top:10px; }
  .detail.on { display:block; animation:fade .28s ease; }

  .sec { padding:11px 0; }
  .sec + .sec { border-top:1px solid var(--line-soft); }
  .sec-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .sec-name { font-weight:800; font-size:14.5px; }
  .sec-net  { font-weight:800; font-size:14.5px; }
  .sec-mean { margin-top:5px; font-size:12.5px; color:var(--ink-2); font-weight:600; }
  .badge {
    display:inline-block; background:var(--line-soft); color:var(--muted);
    border-radius:999px; padding:2px 9px; font-size:10px; font-weight:700;
    margin:0 6px; vertical-align:middle;
  }

  .move {
    margin-top:13px; width:100%; border:none; border-radius:12px; padding:13px;
    font-family:inherit; font-size:14.5px; font-weight:800; cursor:pointer;
    background:var(--brand); color:var(--on-brand);
    box-shadow:0 6px 16px -8px var(--brand); transition:.15s;
  }
  .move:active:not(:disabled) { transform:scale(.985); }
  .move.ready { background:var(--bank); box-shadow:0 6px 16px -8px var(--bank); }
  .move:disabled {
    background:var(--line-soft); color:var(--muted);
    box-shadow:none; cursor:default;
  }

  /* ---------------------------------------------------------- filters */
  .filters { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:13px; }
  .filters label { flex:1 1 130px; }
  .flabel {
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); margin-bottom:5px; display:block;
  }
  select {
    width:100%; font-family:inherit; font-size:14px; font-weight:600;
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    color:var(--tg-theme-text-color, var(--ink));
    border:1px solid var(--line); border-radius:var(--r-sm);
    padding:10px 11px; cursor:pointer; box-shadow:var(--shadow);
  }
  select:focus { outline:2px solid var(--brand); outline-offset:1px; }

  .sumline {
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-weight:800; font-size:15px; padding:14px 17px;
    border-radius:var(--r); margin-bottom:11px;
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .sumline .num { font-size:18px; letter-spacing:-.02em; }

  /* ------------------------------------------- expenses: half + half */
  .split2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .half {
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    border:1px solid var(--line); border-radius:var(--r);
    padding:15px 16px; box-shadow:var(--shadow);
  }
  .half .n { font-size:13px; font-weight:800; color:var(--ink-2); }
  .half .v { font-size:21px; font-weight:900; letter-spacing:-.025em; margin-top:4px; }
  .half .s {
    font-size:10.5px; color:var(--muted); margin-top:3px;
    text-transform:uppercase; letter-spacing:.07em; font-weight:700;
  }
  .diff {
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    border:1px solid var(--line); border-radius:var(--r);
    padding:14px 17px; box-shadow:var(--shadow); margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-weight:800; font-size:14px;
  }
  .diff > span:first-child {
    color:var(--muted); font-size:12px;
    text-transform:uppercase; letter-spacing:.07em;
  }

  /* ------------------------------------------------------ data tables */
  .dt { width:100%; border-collapse:collapse; }
  .dt th {
    font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); padding:0 4px 8px; white-space:nowrap;
  }
  .dt td {
    padding:11px 4px; border-top:1px solid var(--line-soft);
    font-size:13.5px; vertical-align:top; font-weight:600;
  }
  .dt tr:first-child td { border-top:none; }
  .dt .date { white-space:nowrap; color:var(--muted); font-size:12px; font-weight:700; }
  .dt .amt  { white-space:nowrap; font-weight:800; font-size:14px; }
  .dt .who  { font-weight:700; }
  .dt .note { font-size:11px; color:var(--muted); margin-top:3px; font-weight:600; }

  /* --------------------------------------------------------- details */
  .chip {
    font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:999px;
    white-space:nowrap; display:inline-block; align-self:flex-start;
    background:var(--line-soft); color:var(--muted);
  }
  .chip-pending { background:color-mix(in srgb, var(--pending) 14%, transparent); color:var(--pending); }
  .chip-stripe  { background:color-mix(in srgb, var(--stripe) 14%, transparent);  color:var(--stripe); }
  .chip-bank    { background:color-mix(in srgb, var(--bank) 14%, transparent);    color:var(--bank); }
  .chip-paid    { background:var(--line-soft); color:var(--muted); }
  .chip.ready   { background:var(--bank); color:#fff; }

  .pos { color:var(--pos); }
  .neg { color:var(--neg); }
  .muted { color:var(--muted); }
  .title-sm {
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.09em;
    color:var(--muted); margin:24px 0 9px;
  }

  /* ---------------------------------------------------------- states */
  .state {
    display:none; flex-direction:column; align-items:center; justify-content:center;
    min-height:240px; text-align:center; padding:32px 20px; gap:15px;
  }
  .state.on { display:flex; animation:fade .3s ease; }
  .spinner {
    width:38px; height:38px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--brand);
    animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .state-icon { font-size:42px; opacity:.45; }
  .state-text { font-size:16px; font-weight:800; }
  .state-hint { font-size:13px; color:var(--muted); font-weight:600; }

  #content { animation:fade .3s ease; }

  .foot { margin-top:26px; text-align:center; }
  .refresh {
    background:var(--tg-theme-secondary-bg-color, var(--surface));
    color:var(--ink-2); border:1px solid var(--line); border-radius:999px;
    padding:10px 22px; font-family:inherit; font-size:13.5px; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); transition:.15s;
  }
  .refresh:active { transform:scale(.96); }
  .stamp { font-size:11px; color:var(--muted); margin-top:10px; font-weight:600; }

  .toast {
    position:fixed; left:50%; transform:translateX(-50%) translateY(8px);
    bottom:22px; background:var(--pos); color:#fff;
    padding:12px 22px; border-radius:999px; font-size:14px; font-weight:700;
    box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:99;
  }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

    if (inTelegram && tg.showConfirm) {
      try {
        tg.showConfirm(question, function (ok) { if (ok) run(); });
        return;
      } catch (e) { /* fall through to the browser dialog */ }
    }
    if (window.confirm(question)) run();
  }

  function $(id){ return document.getElementById(id); }
  function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c;
    if(x!==undefined&&x!==null)n.textContent=String(x); return n; }
  function nm(x,c){ return el("span","num"+(c?" "+c:""),x); }
  function abs(n,cur){
    var v=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    return cur==="USD"?"$"+v:v+" EGP";
  }
  function round2(n){ return Math.round(n*100)/100; }
  function money(n,cur){ return (n<0?"-":"")+abs(n,cur); }
  function signed(n,cur){ return (n<0?"-":"+")+abs(n,cur); }
  function sPlain(n){ return (n<0?"-":"+")+Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:2}); }
  function pair(p){
    var o=[];
    if(Math.abs(p.USD)>0.005)o.push(money(p.USD,"USD"));
    if(Math.abs(p.EGP)>0.005)o.push(money(p.EGP,"EGP"));
    return o.length?o.join(" · "):abs(0,"USD");
  }
  function dt(iso){
    var d=new Date(iso+"T12:00:00Z"); if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
  }
  function monthOf(iso){ return iso.slice(0,7); }
  function showOnly(id){
    ["loading","error"].forEach(function(s){ $(s).classList.toggle("on", s===id); });
    $("content").style.display = id==="content"?"block":"none";
    $("tabs").style.display = id==="content"?"flex":"none";
  }
  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on");
    setTimeout(function(){t.classList.remove("on");},2200); }
  function headers(){
    var h={};
    if(tg&&tg.initData)h["X-Telegram-Init-Data"]=tg.initData;
    var t=new URLSearchParams(location.search).get("t");
    if(t)h["X-Dashboard-Token"]=t;
    return h;
  }
  /** Every list on every tab is this table, and it always leads with a date. */
  function dataTable(headers){
    var t=el("table","dt"), h=el("tr");
    headers.forEach(function(x){ h.appendChild(el("th",null,x)); });
    t.appendChild(h);
    return t;
  }
  function cell(cls,node,extra){
    var c=el("td",cls);
    if(node) c.appendChild(typeof node==="string"?document.createTextNode(node):node);
    if(extra) c.appendChild(el("div","note",extra));
    return c;
  }

  function sel(labelText,value,options,onChange){
    var wrap=el("label");
    wrap.appendChild(el("span","flabel",labelText));
    var s=el("select");
    options.forEach(function(o){
      var op=el("option",null,o[1]); op.value=o[0];
      if(o[0]===value)op.selected=true; s.appendChild(op);
    });
    s.onchange=function(){ onChange(s.value); };
    wrap.appendChild(s);
    return wrap;
  }

  // =================================================================== home
  function renderHome(c) {
    // The headline: who owes whom, on money that has actually landed.
    if (D.settlePlan.length) {
      D.settlePlan.forEach(function(s){
        var b=el("div","settle");
        b.appendChild(el("div","who", s.from+" "+T.pays+" "+s.to));
        var a=el("div","amt"); a.appendChild(nm(abs(s.amount,s.currency))); b.appendChild(a);
        c.appendChild(b);
      });
    } else {
      var n=el("div","settle none");
      n.appendChild(el("div","amt",T.allSquare));
      n.appendChild(el("div","who",T.allSquareHint));
      c.appendChild(n);
    }

    // One card per stage, always all four, each moving on its own.
    D.stages.forEach(function(st){
      var empty = st.count === 0;
      var card = el("div","card stage-card "+st.status+(empty?" empty":""));

      var head=el("div","st-head");
      head.appendChild(el("span","st-name",T["st_"+st.status]));
      head.appendChild(nm(pair(st.totals),"st-total"));
      card.appendChild(head);

      var meta=[empty ? T.noEntries : st.count+" "+T.entries];
      if (!empty) {
        if (st.status==="bank") meta.push(T.arrived);
        else if (st.status==="paid") meta.push(T.doneNote);
        else if (st.oldestDays!==null) {
          meta.push(T.waitingDays(st.oldestDays, D.stageDays));
          if (st.readyCount) meta.push(T.readyNow(st.readyCount));
          else if (st.nextDue) meta.push(T.dueOn(dt(st.nextDue)));
        }
      }
      card.appendChild(el("div","st-meta",meta.join(" · ")));

      if (!empty && (st.status==="pending"||st.status==="stripe") && st.oldestDays!==null) {
        var track=el("div","track");
        var f=el("div","fill"+(st.readyCount?" ready":""));
        f.style.width=Math.min(100,(st.oldestDays/D.stageDays)*100)+"%";
        track.appendChild(f); card.appendChild(track);
      }

      if (!empty) {
        var netRow=el("div","st-net");
        if (Math.abs(st.netBetween)<0.005) netRow.appendChild(el("span","muted",T.settledHere));
        else {
          var dr=st.netBetween>0?D.anchor:D.other, cr=st.netBetween>0?D.other:D.anchor;
          netRow.appendChild(el("span",null, dr+" "+T.owes+" "+cr+"  "+abs(st.netBetween,"USD")));
        }
        var tgl=el("button","toggle", open[st.status]?T.hide:T.details);
        netRow.appendChild(tgl);
        card.appendChild(netRow);

        var detail=el("div","detail"+(open[st.status]?" on":""));
        detail.appendChild(el("div","st-meta",T.signNote(D.anchor)));
        st.sections.forEach(function(s){
          var box=el("div","sec");
          var top=el("div","sec-top");
          var name=el("span","sec-name",s.person);
          if(s.kind==="employee")name.appendChild(el("span","badge",T.shared));
          top.appendChild(name);
          // Own work is nobody's debt, so it should not be coloured like one.
          top.appendChild(nm(
            s.kind==="own" ? abs(s.net,s.currency) : signed(s.net,s.currency),
            "sec-net "+(s.kind==="own" ? "muted" : (s.net<0?"pos":"neg"))));
          box.appendChild(top);

          var et = dataTable([T.cDate, T.cAmount]);
          s.entries.forEach(function(e){
            var v = e.signed || e.amount;
            var tr = el("tr");
            tr.appendChild(cell("date", dt(e.occurred_on)));
            tr.appendChild(cell(
              "amt " + (s.kind==="own" ? "muted" : (v<0 ? "pos" : "neg")),
              nm(s.kind==="own" ? abs(e.amount,s.currency) : sPlain(v))));
            et.appendChild(tr);
          });
          box.appendChild(et);

          var mean;
          if(s.kind==="own") mean=T.ownWork(s.person);
          else if(s.kind==="employee"&&s.debtor) mean=T.halfGoes(abs(s.debtAmount,s.currency),s.debtor,s.creditor);
          else if(s.debtor) mean=s.debtor+" "+T.owes+" "+s.creditor+"  "+abs(s.debtAmount,s.currency);
          else mean=T.settledHere;
          box.appendChild(el("div","sec-mean",mean));
          detail.appendChild(box);
        });
        card.appendChild(detail);
        tgl.onclick=function(){
          open[st.status]=!open[st.status];
          detail.classList.toggle("on",open[st.status]);
          tgl.textContent=open[st.status]?T.hide:T.details;
        };
      }

      // Each stage carries its own button to push it to the next one.
      if (st.status!=="paid") {
        var next = st.status==="pending" ? "stripe" : st.status==="stripe" ? "bank" : "paid";
        var isSettle = st.status==="bank";
        var btn=el("button","move"+((st.readyCount||isSettle)&&!empty?" ready":""),
          isSettle ? T.weeklyBtn : T.moveTo(T["st_"+next]));
        btn.disabled = empty;
        btn.onclick=function(){
          move(st.status,
            isSettle ? T.confirmWeekly(st.count) : T.confirmMove(st.count,T["st_"+next]),
            btn);
        };
        card.appendChild(btn);
        if (isSettle && !empty) {
          card.appendChild(el("div","st-meta",T.weeklyHint(D.anchor, D.other)));
        }
      }

      c.appendChild(card);
    });
  }

  // ================================================================ income
  function renderIncome(c) {
    var months = [...new Set(D.incomes.map(function(r){return monthOf(r.date);}))].sort().reverse();
    var f=el("div","filters");
    f.appendChild(sel(T.fPerson, F.person,
      [["",T.all]].concat(D.people.map(function(p){return [p,p];})),
      function(v){ F.person=v; draw(); }));
    f.appendChild(sel(T.fStage, F.stage,
      [["",T.all],["pending",T.st_pending],["stripe",T.st_stripe],["bank",T.st_bank],["paid",T.st_paid]],
      function(v){ F.stage=v; draw(); }));
    f.appendChild(sel(T.fMonth, F.month,
      [["",T.all]].concat(months.map(function(m){return [m,m];})),
      function(v){ F.month=v; draw(); }));
    c.appendChild(f);

    var rows = D.incomes.filter(function(r){
      if(F.person && r.earner!==F.person && r.account!==F.person) return false;
      if(F.stage && r.status!==F.stage) return false;
      if(F.month && monthOf(r.date)!==F.month) return false;
      return true;
    });

    var tot={USD:0,EGP:0};
    rows.forEach(function(r){ tot[r.currency]+=r.amount; });
    var sum=el("div","sumline");
    sum.appendChild(el("span",null,T.total+" · "+rows.length+" "+T.entries));
    sum.appendChild(nm(pair(tot)));
    c.appendChild(sum);

    if(!rows.length){ c.appendChild(el("div","card muted",T.noRows)); return; }

    var card=el("div","card");
    var t=dataTable([T.cDate, T.cWork, T.cAmount, T.cStage]);
    rows.forEach(function(r){
      var tr=el("tr");
      tr.appendChild(cell("date", dt(r.date)));
      tr.appendChild(cell("who", r.earner,
        r.earner===r.account ? T.ownAcc : T.inAcc(r.account)));
      tr.appendChild(cell("amt", nm(abs(r.amount,r.currency)), r.description||undefined));

      var ready = r.daysInStage!==null && r.daysInStage>=D.stageDays;
      var stg=el("td");
      stg.appendChild(el("span","chip chip-"+r.status+(ready?" ready":""),T["st_"+r.status]));
      if(r.daysInStage!==null) stg.appendChild(el("div","note", r.daysInStage+" "+T.days));
      tr.appendChild(stg);
      t.appendChild(tr);
    });
    card.appendChild(t);
    c.appendChild(card);
  }

  // =============================================================== expenses
  function renderExpense(c) {
    // --- one half each, then who owes the difference
    var pair2 = [D.anchor, D.other].filter(Boolean);
    ["EGP","USD"].forEach(function(cur){
      var rows = pair2.map(function(name){
        return D.expenseSplit.filter(function(p){ return p.name===name; })[0]
          || { name:name, paid:{USD:0,EGP:0}, share:{USD:0,EGP:0}, net:{USD:0,EGP:0} };
      });
      if (!rows.some(function(p){ return Math.abs(p.paid[cur])>0.005; })) return;

      var split = el("div","split2");
      rows.forEach(function(p){
        var h = el("div","half");
        h.appendChild(el("div","n", p.name));
        h.appendChild(nm(abs(p.paid[cur],cur),"v"));
        h.appendChild(el("div","s", T.spent));
        split.appendChild(h);
      });
      c.appendChild(split);

      // Whoever paid more than their share is owed the gap back.
      var gap = round2((rows[0].paid[cur] - rows[1].paid[cur]) / 2);
      var d = el("div","diff");
      d.appendChild(el("span",null,T.difference));
      if (Math.abs(gap) < 0.005) {
        d.appendChild(el("span","muted",T.allSquare));
      } else {
        var debtor  = gap > 0 ? rows[1].name : rows[0].name;
        var creditor= gap > 0 ? rows[0].name : rows[1].name;
        d.appendChild(el("span",null,
          debtor+" "+T.owes+" "+creditor+"  "+abs(gap,cur)));
      }
      c.appendChild(d);
    });

    var months = [...new Set(D.expenses.map(function(r){return monthOf(r.date);}))].sort().reverse();
    var payers = [...new Set(D.expenses.map(function(r){return r.paidBy;}))].sort();
    var f=el("div","filters");
    f.appendChild(sel(T.fPaidBy, F.paidBy,
      [["",T.all]].concat(payers.map(function(p){return [p,p];})),
      function(v){ F.paidBy=v; draw(); }));
    f.appendChild(sel(T.fCategory, F.category,
      [["",T.all]].concat(D.categories.map(function(x){return [x,x];})),
      function(v){ F.category=v; draw(); }));
    f.appendChild(sel(T.fCurrency, F.currency,
      [["",T.all],["EGP","EGP"],["USD","USD"]],
      function(v){ F.currency=v; draw(); }));
    f.appendChild(sel(T.fMonth, F.month,
      [["",T.all]].concat(months.map(function(m){return [m,m];})),
      function(v){ F.month=v; draw(); }));
    c.appendChild(f);

    var rows = D.expenses.filter(function(r){
      if(F.paidBy && r.paidBy!==F.paidBy) return false;
      if(F.category && r.category!==F.category) return false;
      if(F.currency && r.currency!==F.currency) return false;
      if(F.month && monthOf(r.date)!==F.month) return false;
      return true;
    });

    var tot={USD:0,EGP:0};
    rows.forEach(function(r){ tot[r.currency]+=r.amount; });
    var sum=el("div","sumline");
    sum.appendChild(el("span",null,T.total+" · "+rows.length+" "+T.entries));
    sum.appendChild(nm(pair(tot)));
    c.appendChild(sum);

    if(rows.length){
      var card=el("div","card");
      var t=dataTable([T.cDate, T.cPaidBy, T.cCategory, T.cAmount]);
      rows.forEach(function(r){
        var split = r.split==="founders_equal" ? T.splitEqual
          : r.split==="charged_to" ? T.splitTo+" "+r.chargeTo : T.splitNone;
        var tr=el("tr");
        tr.appendChild(cell("date", dt(r.date)));
        tr.appendChild(cell("who", r.paidBy, split));
        tr.appendChild(cell(null,
          r.category || (r.kind==="payout"?T.payout:T.expense),
          r.description||undefined));
        tr.appendChild(cell("amt", nm(abs(r.amount,r.currency))));
        t.appendChild(tr);
      });
      card.appendChild(t);
      c.appendChild(card);
    } else {
      c.appendChild(el("div","card muted",T.noRows));
    }

    // who paid vs who owes it back
    if(D.expenseSplit.length){
      c.appendChild(el("div","title-sm",T.whoPaid));
      ["EGP","USD"].forEach(function(cur){
        var rs=D.expenseSplit.filter(function(p){
          return Math.abs(p.paid[cur])>0.005||Math.abs(p.share[cur])>0.005;
        });
        if(!rs.length)return;
        var card=el("div","card");
        card.appendChild(el("div","flabel",cur));
        var t=el("table"), h=el("tr");
        [T.thName,T.thPaid,T.thShare,T.thBack].forEach(function(x){h.appendChild(el("th",null,x));});
        t.appendChild(h);
        rs.forEach(function(p){
          var tr=el("tr");
          tr.appendChild(el("td",null,p.name));
          var a=el("td"); a.appendChild(nm(abs(p.paid[cur],cur))); tr.appendChild(a);
          var b=el("td","muted"); b.appendChild(nm(abs(p.share[cur],cur))); tr.appendChild(b);
          var n=el("td"); n.appendChild(nm(signed(p.net[cur],cur), p.net[cur]>=0?"pos":"neg")); tr.appendChild(n);
          t.appendChild(tr);
        });
        card.appendChild(t); c.appendChild(card);
      });
    }
  }

  // ================================================================== draw
  function draw() {
    if(!D) return;
    document.documentElement.lang=lang;
    document.documentElement.dir = lang==="ar"?"rtl":"ltr";
    document.body.dir = lang==="ar"?"rtl":"ltr";
    $("title").textContent=T.title;
    $("langBtn").textContent = lang==="ar"?"EN":"ع";
    $("whoAmI").textContent=D.me.name;
    $("tab-home").textContent=T.tabHome;
    $("tab-income").textContent=T.tabIncome;
    $("tab-expense").textContent=T.tabExpense;
    ["home","income","expense"].forEach(function(k){
      $("tab-"+k).classList.toggle("on", tab===k);
    });
    showOnly("content");

    var c=$("content"); c.textContent="";
    if(tab==="home") renderHome(c);
    else if(tab==="income") renderIncome(c);
    else renderExpense(c);

    var foot=el("div","foot");
    var rb=el("button","refresh",T.refresh); rb.onclick=load; foot.appendChild(rb);
    foot.appendChild(el("div","stamp",T.updated+" "+new Date(D.generatedAt).toLocaleTimeString()));
    c.appendChild(foot);
  }

  function move(from,question,btn){
    if(busy)return;
    confirmThen(question, function(){
      busy=true;
      btn.disabled=true;
      var was=btn.textContent;
      btn.textContent=T.moving;
      fetch(BASE+"/advance",{
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"},headers()),
        body:JSON.stringify({from:from})
      }).then(function(r){ return r.json().then(function(j){return {ok:r.ok,body:j};}); })
        .then(function(res){
          busy=false;
          if(!res.ok){
            // a failed move should not blank the whole page
            btn.disabled=false; btn.textContent=was;
            return toast(res.body.error||T.errGeneric);
          }
          toast(res.body.moved?T.moved(res.body.moved):T.nothingMoved);
          D=res.body; draw();
        }).catch(function(){
          busy=false; btn.disabled=false; btn.textContent=was; toast(T.errNet);
        });
    });
  }

  function fail(m){ $("errorText").textContent=m; showOnly("error"); }

  function load(){
    showOnly("loading"); $("loadingText").textContent=T.loading;
    var h=headers();
    if(!h["X-Dashboard-Token"]&&!h["X-Telegram-Init-Data"]) return fail(T.openFromGroup);
    fetch(BASE+"/data",{headers:h,cache:"no-store"})
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,body:j};}); })
      .then(function(res){
        if(!res.ok) return fail(res.body.error||T.errGeneric);
        D=res.body; draw();
      }).catch(function(){ fail(T.errNet); });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(el2){
    el2.onclick=function(){ tab=el2.getAttribute("data-tab"); F.person=F.stage=F.month=F.currency=F.paidBy=F.category=""; draw(); };
  });
  $("langBtn").onclick=function(){
    lang = lang==="ar"?"en":"ar"; T=STR[lang];
    if(D)draw(); else load();
  };

  load();
})();
</script>
</body>
</html>
