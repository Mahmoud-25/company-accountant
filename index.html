<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💰 لوحة المحاسبة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif;
    background: var(--tg-theme-bg-color, #f8fafc);
    color: var(--tg-theme-text-color, #1e293b);
    padding: 12px 12px 80px; min-height: 100vh;
  }
  body[dir="rtl"] { text-align: right; }
  body[dir="ltr"] { text-align: left; }
  .container { max-width: 720px; margin: 0 auto; }

  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  h1 { font-size: 21px; font-weight: 700; margin-bottom: 3px; }
  .subtitle { font-size: 12px; color: var(--tg-theme-hint-color, #64748b); }
  .lang-switch {
    background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff);
    border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .user-info {
    font-size: 11px; color: var(--tg-theme-hint-color, #64748b); margin-bottom: 14px;
    padding: 5px 10px; background: var(--tg-theme-secondary-bg-color, #f1f5f9);
    border-radius: 6px; display: inline-block;
  }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .kpi-card {
    background: var(--tg-theme-secondary-bg-color, #fff); padding: 12px; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1); position: relative; overflow: hidden;
  }
  .kpi-card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; }
  body[dir="rtl"] .kpi-card::before { right: auto; left: 0; }
  .kpi-card.blue::before { background: #3b82f6; }
  .kpi-card.green::before { background: #10b981; }
  .kpi-card.red::before { background: #ef4444; }
  .kpi-card.purple::before { background: #8b5cf6; }
  .kpi-label {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    color: var(--tg-theme-hint-color, #64748b); margin-bottom: 4px;
  }
  .kpi-value { font-size: 17px; font-weight: 700; }
  .kpi-sub { font-size: 10px; color: var(--tg-theme-hint-color, #94a3b8); margin-top: 2px; }
  .kpi-icon { position: absolute; top: 10px; right: 10px; font-size: 24px; opacity: .2; }
  body[dir="rtl"] .kpi-icon { right: auto; left: 10px; }

  .section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--tg-theme-hint-color, #94a3b8); margin: 22px 0 8px;
  }
  .settle {
    background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff);
    border-radius: 14px; padding: 15px 18px; margin-bottom: 8px;
  }
  .settle .who { font-size: 13px; opacity: .92; }
  .settle .amt { font-size: 27px; font-weight: 750; margin-top: 2px; letter-spacing: -.02em; }
  .settle.none {
    background: var(--tg-theme-secondary-bg-color, #fff); color: var(--tg-theme-text-color, #1e293b);
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .settle.none .amt { font-size: 18px; font-weight: 700; }
  .settle.none .who { color: var(--tg-theme-hint-color, #64748b); }

  .card {
    background: var(--tg-theme-secondary-bg-color, #fff); padding: 14px 16px;
    border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 10px;
  }
  .stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .stage-head .t { font-weight: 700; font-size: 15px; }
  .stage-head .n { font-size: 13px; color: var(--tg-theme-hint-color, #64748b); }

  /* one person's column, exactly like the running note */
  .sec { padding: 11px 0; }
  .sec + .sec { border-top: 1px solid var(--tg-theme-bg-color, #eef2f7); }
  .sec-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .sec-name { font-weight: 700; font-size: 15px; }
  .sec-net { font-weight: 700; font-size: 15px; }
  .sec-nums {
    margin-top: 5px; font-size: 13px; word-spacing: .35em;
    color: var(--tg-theme-hint-color, #64748b);
  }
  .sec-mean { margin-top: 5px; font-size: 12.5px; }
  .badge {
    display: inline-block; background: var(--tg-theme-bg-color, #eef2f7);
    color: var(--tg-theme-hint-color, #64748b); border-radius: 999px;
    padding: 1px 8px; font-size: 10px; margin: 0 5px; vertical-align: middle;
  }
  .stage-net {
    margin-top: 12px; padding-top: 11px; font-weight: 700; font-size: 14px;
    border-top: 2px solid var(--tg-theme-bg-color, #eef2f7);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .move {
    margin-top: 12px; width: 100%; border: none; border-radius: 10px; padding: 11px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--tg-theme-button-color, #3390ec); color: var(--tg-theme-button-text-color, #fff);
  }
  .move:disabled { opacity: .55; cursor: default; }
  .move.done { background: #10b981; }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; padding: 4px 0; color: var(--tg-theme-hint-color, #64748b); }
  td { padding: 7px 0; border-top: 1px solid var(--tg-theme-bg-color, #eef2f7); font-size: 14px; }
  body[dir="rtl"] th, body[dir="rtl"] td { text-align: left; }
  body[dir="rtl"] th:first-child, body[dir="rtl"] td:first-child { text-align: right; }
  body[dir="ltr"] th, body[dir="ltr"] td { text-align: right; }
  body[dir="ltr"] th:first-child, body[dir="ltr"] td:first-child { text-align: left; }

  .pos { color: #10b981; } .neg { color: #ef4444; }
  .muted { color: var(--tg-theme-hint-color, #64748b); }
  .hint { font-size: 12px; color: var(--tg-theme-hint-color, #64748b); margin-top: 2px; }

  .txn { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; }
  .txn + .txn { border-top: 1px solid var(--tg-theme-bg-color, #eef2f7); }
  .txn-main { font-size: 14px; font-weight: 600; }
  .txn-sub { font-size: 12px; color: var(--tg-theme-hint-color, #64748b); margin-top: 2px; }
  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--tg-theme-bg-color, #eef2f7); color: var(--tg-theme-hint-color, #64748b);
    align-self: flex-start;
  }

  .state {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 240px; text-align: center; padding: 30px 20px; gap: 14px;
  }
  .state.on { display: flex; }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid var(--tg-theme-bg-color, #e2e8f0);
    border-top-color: var(--tg-theme-button-color, #3390ec);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-icon { font-size: 44px; opacity: .5; }
  .state-text { font-size: 15px; font-weight: 600; }
  .state-hint { font-size: 13px; color: var(--tg-theme-hint-color, #64748b); }

  .foot { margin-top: 26px; text-align: center; }
  .refresh {
    background: var(--tg-theme-secondary-bg-color, #fff); color: var(--tg-theme-text-color, #1e293b);
    border: 1px solid var(--tg-theme-hint-color, #e2e8f0); border-radius: 9px;
    padding: 8px 16px; font-size: 14px; cursor: pointer;
  }
  .stamp { font-size: 11px; color: var(--tg-theme-hint-color, #94a3b8); margin-top: 8px; }
  .num { direction: ltr; unicode-bidi: embed; display: inline-block; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    background: #10b981; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body dir="rtl">
<div class="container">
  <div class="header-top">
    <div>
      <h1 id="title">💰 لوحة المحاسبة</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <button class="lang-switch" id="langBtn">EN</button>
  </div>
  <div class="user-info" id="userInfo" style="display:none"></div>

  <div class="state on" id="loading">
    <div class="spinner"></div>
    <div class="state-hint" id="loadingText">جاري التحميل…</div>
  </div>
  <div class="state" id="error">
    <div class="state-icon">⚠️</div>
    <div class="state-text" id="errorText"></div>
  </div>
  <div class="state" id="empty">
    <div class="state-icon">📭</div>
    <div class="state-text" id="emptyText"></div>
    <div class="state-hint" id="emptyHint"></div>
  </div>

  <div id="content" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var BASE = "https://qrxiqqkzmtumcwjfqujq.supabase.co/functions/v1/dashboard";

  var STR = {
    ar: {
      title: "💰 لوحة المحاسبة",
      loading: "جاري التحميل…",
      emptyText: "لا توجد بيانات بعد",
      emptyHint: "سجّل أول عملية في مجموعة تيليجرام.",
      openFromGroup: "افتح اللوحة من أمر /dashboard في المجموعة.",
      income: "الدخل هذا الشهر", expenses: "المصروفات هذا الشهر",
      owedNow: "مستحق الآن", onTheWay: "في الطريق",
      whoPays: "من يدفع لمن", pays: "يدفع لـ",
      allSquare: "لا توجد مستحقات", allSquareHint: "الحسابات متساوية.",
      stages: "مراحل الأموال",
      st_pending: "⏳ قيد الانتظار", st_stripe: "💳 Stripe",
      st_bank: "🏦 البنك", st_paid: "🤝 تم التقسيم",
      owes: "مدين لـ",
      ownWork: function (a) { return "عمل " + a + " على حسابه — لا مستحقات"; },
      halfGoes: function (h, a, b) { return "النصف (" + h + ") → " + a + " " + "مدين لـ" + " " + b; },
      net: "الصافي",
      settledHere: "لا مستحقات في هذه المرحلة",
      shared: "مشترك",
      moveTo: function (s) { return "➡️ نقل الكل إلى " + s; },
      confirmMove: function (n, s) { return "نقل " + n + " عملية إلى " + s + "؟"; },
      moved: function (n) { return "تم نقل " + n + " عملية"; },
      nothingMoved: "لا يوجد ما يُنقل",
      bankOnly: "المحسوب في المستحقات هو مرحلة البنك فقط.",
      signNote: function (a) {
        return "الأرقام من منظور " + a + ": سالب = مستحق لـ " + a + " · موجب = مستحق على " + a;
      },
      expensesTitle: "المصروفات — من دفع",
      thName: "الشريك", thPaid: "دفع", thShare: "حصته", thBack: "له/عليه",
      month: "ملخص الشهر", thEarned: "المكتسب", thCosts: "التكاليف", thNet: "الصافي",
      recent: "آخر العمليات",
      refresh: "تحديث", updated: "آخر تحديث",
      kind: { income: "دخل", expense: "مصروف", payout: "أجر موظف", transfer: "تحويل" },
      inAccount: function (w, a) { return w + " — حساب " + a; },
      errGeneric: "تعذّر تحميل اللوحة.", errNet: "تعذّر الوصول للخادم."
    },
    en: {
      title: "💰 Accounting dashboard",
      loading: "Loading…",
      emptyText: "Nothing recorded yet",
      emptyHint: "Add your first entry in the Telegram group.",
      openFromGroup: "Open this with /dashboard in the group.",
      income: "Income this month", expenses: "Expenses this month",
      owedNow: "Owed now", onTheWay: "On the way",
      whoPays: "Who pays whom", pays: "pays",
      allSquare: "All square", allSquareHint: "Nothing is owed.",
      stages: "Money by stage",
      st_pending: "⏳ Pending", st_stripe: "💳 Stripe",
      st_bank: "🏦 Bank", st_paid: "🤝 Shared out",
      owes: "owes",
      ownWork: function (a) { return a + "'s own work — no debt"; },
      halfGoes: function (h, a, b) { return "half (" + h + ") → " + a + " owes " + b; },
      net: "Net",
      settledHere: "nothing owed at this stage",
      shared: "shared",
      moveTo: function (s) { return "➡️ Move all to " + s; },
      confirmMove: function (n, s) { return "Move " + n + " entries to " + s + "?"; },
      moved: function (n) { return "Moved " + n + " entries"; },
      nothingMoved: "Nothing to move",
      bankOnly: "Only the bank stage counts as owed.",
      signNote: function (a) {
        return "Signs are from " + a + "'s side: negative = owed to " + a + " · positive = owed by " + a;
      },
      expensesTitle: "Expenses — who paid",
      thName: "Partner", thPaid: "Paid", thShare: "Share", thBack: "Owed back",
      month: "Month summary", thEarned: "Earned", thCosts: "Costs", thNet: "Net",
      recent: "Recent entries",
      refresh: "Refresh", updated: "Updated",
      kind: { income: "Income", expense: "Expense", payout: "Payout", transfer: "Transfer" },
      inAccount: function (w, a) { return w + " — " + a + "'s account"; },
      errGeneric: "Could not load the dashboard.", errNet: "Could not reach the server."
    }
  };

  var lang = "ar", T = STR.ar, payload = null, busy = false;
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function numSpan(text, cls) { return el("span", "num" + (cls ? " " + cls : ""), text); }
  function abs(n, cur) {
    var v = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return cur === "USD" ? "$" + v : v + " EGP";
  }
  function money(n, cur) { return (n < 0 ? "-" : "") + abs(n, cur); }
  function signed(n, cur) { return (n < 0 ? "-" : "+") + abs(n, cur); }
  function signedPlain(n) {
    return (n < 0 ? "-" : "+") + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  function pair(p) {
    var o = [];
    if (Math.abs(p.USD) > 0.005) o.push(money(p.USD, "USD"));
    if (Math.abs(p.EGP) > 0.005) o.push(money(p.EGP, "EGP"));
    return o.length ? o.join(" · ") : abs(0, "USD");
  }
  function niceDate(iso) {
    var d = new Date(iso + "T12:00:00Z");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  }
  function showOnly(id) {
    ["loading", "error", "empty"].forEach(function (s) { $(s).classList.toggle("on", s === id); });
    $("content").style.display = id === "content" ? "block" : "none";
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.classList.add("on");
    setTimeout(function () { t.classList.remove("on"); }, 2200);
  }
  function headers() {
    var h = {};
    if (tg && tg.initData) h["X-Telegram-Init-Data"] = tg.initData;
    var t = new URLSearchParams(location.search).get("t");
    if (t) h["X-Dashboard-Token"] = t;
    return h;
  }

  // -------------------------------------------------------------- render
  function render() {
    var d = payload;
    if (!d) return;

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.body.dir = lang === "ar" ? "rtl" : "ltr";
    $("title").textContent = T.title;
    $("langBtn").textContent = lang === "ar" ? "EN" : "ع";
    $("subtitle").textContent = d.month.title;
    $("userInfo").textContent = d.me.name;
    $("userInfo").style.display = "inline-block";

    var c = $("content");
    c.textContent = "";

    if (!d.stages.length && !d.recent.length && !d.settlePlan.length) {
      $("emptyText").textContent = T.emptyText;
      $("emptyHint").textContent = T.emptyHint;
      showOnly("empty");
      return;
    }
    showOnly("content");

    // ---- KPI cards
    var expTotal = {
      USD: d.month.totals.expense.USD + d.month.totals.payout.USD,
      EGP: d.month.totals.expense.EGP + d.month.totals.payout.EGP
    };
    var inflight = { USD: 0, EGP: 0 };
    d.stages.forEach(function (s) {
      if (s.status === "bank") return;
      inflight.USD += s.totals.USD; inflight.EGP += s.totals.EGP;
    });
    var owedNow = d.settlePlan.length
      ? d.settlePlan.map(function (s) { return money(s.amount, s.currency); }).join(" · ")
      : T.allSquare;
    var owedSub = d.settlePlan.length
      ? d.settlePlan.map(function (s) { return s.from + " → " + s.to; }).join(" · ")
      : "";

    var grid = el("div", "kpi-grid");
    [["blue", "💵", T.income, pair(d.month.totals.income), ""],
     ["red", "🧾", T.expenses, pair(expTotal), ""],
     ["green", "⚖️", T.owedNow, owedNow, owedSub],
     ["purple", "📦", T.onTheWay, pair(inflight), ""]
    ].forEach(function (k) {
      var card = el("div", "kpi-card " + k[0]);
      card.appendChild(el("div", "kpi-icon", k[1]));
      card.appendChild(el("div", "kpi-label", k[2]));
      var v = el("div", "kpi-value"); v.appendChild(numSpan(k[3])); card.appendChild(v);
      if (k[4]) card.appendChild(el("div", "kpi-sub", k[4]));
      grid.appendChild(card);
    });
    c.appendChild(grid);

    // ---- who pays whom
    c.appendChild(el("div", "section-title", T.whoPays));
    if (d.settlePlan.length) {
      d.settlePlan.forEach(function (s) {
        var b = el("div", "settle");
        b.appendChild(el("div", "who", s.from + " " + T.pays + " " + s.to));
        var a = el("div", "amt"); a.appendChild(numSpan(abs(s.amount, s.currency)));
        b.appendChild(a);
        c.appendChild(b);
      });
    } else {
      var none = el("div", "settle none");
      none.appendChild(el("div", "amt", T.allSquare));
      none.appendChild(el("div", "who", T.allSquareHint));
      c.appendChild(none);
    }

    // ---- the stages, in the shape of the running note
    if (d.stages.length) {
      c.appendChild(el("div", "section-title", T.stages));
      c.appendChild(el("div", "hint", T.signNote(d.anchor)));

      d.stages.forEach(function (st) {
        var card = el("div", "card");
        var head = el("div", "stage-head");
        head.appendChild(el("span", "t", T["st_" + st.status]));
        head.appendChild(numSpan(pair(st.totals), "n"));
        card.appendChild(head);

        st.sections.forEach(function (s) {
          var box = el("div", "sec");

          var top = el("div", "sec-top");
          var nm = el("span", "sec-name", s.person);
          if (s.kind === "employee") nm.appendChild(el("span", "badge", T.shared));
          top.appendChild(nm);
          top.appendChild(numSpan(signed(s.net, s.currency),
            "sec-net " + (s.net < 0 ? "pos" : "neg")));
          box.appendChild(top);

          box.appendChild(numSpan(
            s.entries.map(function (e) { return signedPlain(e.signed || e.amount); }).join("   "),
            "sec-nums"));

          var mean;
          if (s.kind === "own") mean = T.ownWork(s.person);
          else if (s.kind === "employee" && s.debtor) {
            mean = T.halfGoes(abs(s.debtAmount, s.currency), s.debtor, s.creditor);
          } else if (s.debtor) {
            mean = s.debtor + " " + T.owes + " " + s.creditor + "  " + abs(s.debtAmount, s.currency);
          } else mean = T.settledHere;
          box.appendChild(el("div", "sec-mean", mean));

          card.appendChild(box);
        });

        // stage net, in words
        var netRow = el("div", "stage-net");
        netRow.appendChild(el("span", null, T.net));
        if (Math.abs(st.netBetween) < 0.005) {
          netRow.appendChild(el("span", "muted", T.settledHere));
        } else {
          var dr = st.netBetween > 0 ? d.anchor : d.other;
          var cr = st.netBetween > 0 ? d.other : d.anchor;
          netRow.appendChild(el("span", null,
            dr + " " + T.owes + " " + cr + "  " + abs(st.netBetween, "USD")));
        }
        card.appendChild(netRow);

        // the batch move button
        if (st.status !== "paid") {
          var nextLabel = st.status === "pending" ? T.st_stripe
            : st.status === "stripe" ? T.st_bank : T.st_paid;
          var btn = el("button", "move" + (st.status === "bank" ? " done" : ""),
            T.moveTo(nextLabel));
          btn.onclick = function () { moveStage(st.status, nextLabel, st.count, btn); };
          card.appendChild(btn);
        }

        c.appendChild(card);
      });
      c.appendChild(el("div", "hint", T.bankOnly));
    }

    // ---- expenses: who paid what
    if (d.expenses.length) {
      c.appendChild(el("div", "section-title", T.expensesTitle));
      ["EGP", "USD"].forEach(function (cur) {
        var rows = d.expenses.filter(function (p) {
          return Math.abs(p.paid[cur]) > 0.005 || Math.abs(p.share[cur]) > 0.005;
        });
        if (!rows.length) return;
        var card = el("div", "card");
        card.appendChild(el("div", "kpi-label", cur));
        var t = el("table"), h = el("tr");
        [T.thName, T.thPaid, T.thShare, T.thBack].forEach(function (x) { h.appendChild(el("th", null, x)); });
        t.appendChild(h);
        rows.forEach(function (p) {
          var tr = el("tr");
          tr.appendChild(el("td", null, p.name));
          var a = el("td"); a.appendChild(numSpan(abs(p.paid[cur], cur))); tr.appendChild(a);
          var b = el("td", "muted"); b.appendChild(numSpan(abs(p.share[cur], cur))); tr.appendChild(b);
          var n = el("td");
          n.appendChild(numSpan(signed(p.net[cur], cur), p.net[cur] >= 0 ? "pos" : "neg"));
          tr.appendChild(n);
          t.appendChild(tr);
        });
        card.appendChild(t);
        c.appendChild(card);
      });
    }

    // ---- month summary
    if (d.month.perPerson.length) {
      c.appendChild(el("div", "section-title", T.month));
      ["USD", "EGP"].forEach(function (cur) {
        var rows = d.month.perPerson.filter(function (p) {
          return Math.abs(p.income[cur]) > 0.005 || Math.abs(p.costs[cur]) > 0.005;
        });
        if (!rows.length) return;
        var card = el("div", "card");
        card.appendChild(el("div", "kpi-label", cur));
        var t = el("table"), h = el("tr");
        [T.thName, T.thEarned, T.thCosts, T.thNet].forEach(function (x) { h.appendChild(el("th", null, x)); });
        t.appendChild(h);
        rows.forEach(function (p) {
          var tr = el("tr");
          tr.appendChild(el("td", null, p.name));
          var a = el("td"); a.appendChild(numSpan(abs(p.income[cur], cur))); tr.appendChild(a);
          var b = el("td", "muted"); b.appendChild(numSpan("-" + abs(p.costs[cur], cur))); tr.appendChild(b);
          var n = el("td");
          n.appendChild(numSpan(money(p.net[cur], cur), p.net[cur] >= 0 ? "pos" : "neg"));
          tr.appendChild(n);
          t.appendChild(tr);
        });
        card.appendChild(t);
        c.appendChild(card);
      });
    }

    // ---- log
    if (d.recent.length) {
      c.appendChild(el("div", "section-title", T.recent));
      var log = el("div", "card");
      d.recent.forEach(function (r) {
        var row = el("div", "txn"), left = el("div");
        var main = el("div", "txn-main");
        main.appendChild(document.createTextNode(T.kind[r.type] + " · "));
        main.appendChild(numSpan(abs(r.amount, r.currency)));
        left.appendChild(main);
        var who;
        if (r.type === "income") {
          who = r.earned_by_name === r.received_by_name
            ? r.received_by_name : T.inAccount(r.earned_by_name, r.received_by_name);
        } else if (r.type === "transfer") {
          who = r.from_person_name + " → " + r.to_person_name;
        } else {
          who = r.paid_by_name + (r.beneficiary_name ? " → " + r.beneficiary_name : "");
        }
        var note = [r.description, r.client].filter(Boolean).join(" — ");
        left.appendChild(el("div", "txn-sub",
          who + " · " + niceDate(r.occurred_on) + (note ? " · " + note : "")));
        row.appendChild(left);
        if (r.status) row.appendChild(el("span", "chip", T["st_" + r.status]));
        log.appendChild(row);
      });
      c.appendChild(log);
    }

    var foot = el("div", "foot");
    var rb = el("button", "refresh", T.refresh);
    rb.onclick = load;
    foot.appendChild(rb);
    foot.appendChild(el("div", "stamp",
      T.updated + " " + new Date(d.generatedAt).toLocaleTimeString()));
    c.appendChild(foot);
  }

  // ------------------------------------------------------- stage moving
  function moveStage(from, label, count, btn) {
    if (busy) return;
    var ask = T.confirmMove(count, label);

    function go() {
      busy = true; btn.disabled = true;
      fetch(BASE + "/advance", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, headers()),
        body: JSON.stringify({ from: from })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (res) {
          busy = false;
          if (!res.ok) { btn.disabled = false; return fail(res.body.error || T.errGeneric); }
          toast(res.body.moved ? T.moved(res.body.moved) : T.nothingMoved);
          payload = res.body;
          render();
        })
        .catch(function () { busy = false; btn.disabled = false; fail(T.errNet); });
    }

    if (tg && tg.showConfirm) tg.showConfirm(ask, function (ok) { if (ok) go(); });
    else if (window.confirm(ask)) go();
  }

  function fail(msg) { $("errorText").textContent = msg; showOnly("error"); }

  function load() {
    showOnly("loading");
    $("loadingText").textContent = T.loading;
    var h = headers();
    if (!h["X-Dashboard-Token"] && !h["X-Telegram-Init-Data"]) return fail(T.openFromGroup);

    fetch(BASE + "/data", { headers: h, cache: "no-store" })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok) return fail(res.body.error || T.errGeneric);
        payload = res.body; render();
      })
      .catch(function () { fail(T.errNet); });
  }

  $("langBtn").onclick = function () {
    lang = lang === "ar" ? "en" : "ar";
    T = STR[lang];
    if (payload) render(); else load();
  };

  load();
})();
</script>
</body>
</html>
