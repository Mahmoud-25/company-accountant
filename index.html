<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💰 لوحة المحاسبة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Cairo',sans-serif;
    background:var(--tg-theme-bg-color,#f8fafc); color:var(--tg-theme-text-color,#1e293b);
    padding:12px 12px 70px; min-height:100vh;
  }
  body[dir="rtl"] { text-align:right; } body[dir="ltr"] { text-align:left; }
  .container { max-width:720px; margin:0 auto; }

  .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1 { font-size:19px; font-weight:700; }
  .who-am-i { font-size:11px; color:var(--tg-theme-hint-color,#64748b); }
  .lang-switch {
    background:var(--tg-theme-button-color,#3390ec); color:var(--tg-theme-button-text-color,#fff);
    border:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;
  }

  /* tabs */
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab {
    flex:1; text-align:center; padding:9px 6px; border-radius:9px; font-size:13px;
    font-weight:600; cursor:pointer; border:1px solid transparent;
    background:var(--tg-theme-secondary-bg-color,#fff); color:var(--tg-theme-hint-color,#64748b);
  }
  .tab.on {
    background:var(--tg-theme-button-color,#3390ec); color:var(--tg-theme-button-text-color,#fff);
  }

  .card {
    background:var(--tg-theme-secondary-bg-color,#fff); padding:14px 16px;
    border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:10px;
  }
  .settle {
    background:var(--tg-theme-button-color,#3390ec); color:var(--tg-theme-button-text-color,#fff);
    border-radius:14px; padding:15px 18px; margin-bottom:10px;
  }
  .settle .who { font-size:13px; opacity:.92; }
  .settle .amt { font-size:27px; font-weight:750; margin-top:2px; letter-spacing:-.02em; }
  .settle.none { background:var(--tg-theme-secondary-bg-color,#fff); color:var(--tg-theme-text-color,#1e293b); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .settle.none .amt { font-size:18px; font-weight:700; }
  .settle.none .who { color:var(--tg-theme-hint-color,#64748b); }

  /* stage card */
  .st-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .st-name { font-weight:700; font-size:16px; }
  .st-total { font-weight:700; font-size:16px; }
  .st-meta { font-size:12px; color:var(--tg-theme-hint-color,#64748b); margin-top:5px; }
  .track { height:6px; background:var(--tg-theme-bg-color,#eef2f7); border-radius:999px; margin-top:8px; overflow:hidden; }
  .fill { height:100%; border-radius:999px; background:#3b82f6; }
  .fill.ready { background:#10b981; }
  .st-net {
    margin-top:11px; padding-top:10px; border-top:1px solid var(--tg-theme-bg-color,#eef2f7);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:14px; font-weight:600;
  }
  .toggle {
    background:none; border:none; cursor:pointer; font-size:12px; font-weight:600;
    color:var(--tg-theme-link-color,#3390ec); padding:2px 4px;
  }
  .detail { display:none; margin-top:8px; }
  .detail.on { display:block; }
  .sec { padding:9px 0; }
  .sec + .sec { border-top:1px solid var(--tg-theme-bg-color,#eef2f7); }
  .sec-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .sec-name { font-weight:700; font-size:14px; }
  .sec-net { font-weight:700; font-size:14px; }
  .sec-nums { margin-top:4px; font-size:12.5px; word-spacing:.35em; color:var(--tg-theme-hint-color,#64748b); }
  .sec-mean { margin-top:4px; font-size:12px; }
  .badge {
    display:inline-block; background:var(--tg-theme-bg-color,#eef2f7); color:var(--tg-theme-hint-color,#64748b);
    border-radius:999px; padding:1px 8px; font-size:10px; margin:0 5px; vertical-align:middle;
  }
  .move {
    margin-top:11px; width:100%; border:none; border-radius:10px; padding:11px;
    font-size:14px; font-weight:600; cursor:pointer;
    background:var(--tg-theme-button-color,#3390ec); color:var(--tg-theme-button-text-color,#fff);
  }
  .move.ready { background:#10b981; }
  .move:disabled { opacity:.55; cursor:default; }

  /* filters */
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .filters label { flex:1 1 120px; }
  .flabel {
    font-size:10px; font-weight:700; text-transform:uppercase;
    color:var(--tg-theme-hint-color,#94a3b8); margin-bottom:3px; display:block;
  }
  select {
    width:100%; background:var(--tg-theme-secondary-bg-color,#fff);
    color:var(--tg-theme-text-color,#1e293b); border:1px solid var(--tg-theme-hint-color,#e2e8f0);
    border-radius:8px; padding:9px 10px; font-size:14px; cursor:pointer;
  }
  .sumline {
    display:flex; justify-content:space-between; gap:10px; font-weight:700;
    font-size:15px; padding:12px 16px; border-radius:12px; margin-bottom:10px;
    background:var(--tg-theme-secondary-bg-color,#fff); box-shadow:0 1px 3px rgba(0,0,0,.08);
  }

  /* rows */
  .row { display:flex; justify-content:space-between; gap:10px; padding:10px 0; }
  .row + .row { border-top:1px solid var(--tg-theme-bg-color,#eef2f7); }
  .r-main { font-size:14px; font-weight:600; }
  .r-sub { font-size:12px; color:var(--tg-theme-hint-color,#64748b); margin-top:2px; }
  .r-right { text-align:center; }
  .chip {
    font-size:11px; padding:2px 9px; border-radius:999px; white-space:nowrap; display:inline-block;
    background:var(--tg-theme-bg-color,#eef2f7); color:var(--tg-theme-hint-color,#64748b);
  }
  .chip.ready { background:#10b981; color:#fff; }

  table { width:100%; border-collapse:collapse; }
  th { font-size:11px; font-weight:600; padding:4px 0; color:var(--tg-theme-hint-color,#64748b); }
  td { padding:7px 0; border-top:1px solid var(--tg-theme-bg-color,#eef2f7); font-size:14px; }
  body[dir="rtl"] th, body[dir="rtl"] td { text-align:left; }
  body[dir="rtl"] th:first-child, body[dir="rtl"] td:first-child { text-align:right; }
  body[dir="ltr"] th, body[dir="ltr"] td { text-align:right; }
  body[dir="ltr"] th:first-child, body[dir="ltr"] td:first-child { text-align:left; }

  .pos { color:#10b981; } .neg { color:#ef4444; }
  .muted { color:var(--tg-theme-hint-color,#64748b); }
  .title-sm {
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--tg-theme-hint-color,#94a3b8); margin:20px 0 8px;
  }
  .state { display:none; flex-direction:column; align-items:center; justify-content:center;
    min-height:220px; text-align:center; padding:30px 20px; gap:14px; }
  .state.on { display:flex; }
  .spinner { width:42px; height:42px; border-radius:50%;
    border:4px solid var(--tg-theme-bg-color,#e2e8f0);
    border-top-color:var(--tg-theme-button-color,#3390ec); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .state-icon { font-size:42px; opacity:.5; }
  .state-text { font-size:15px; font-weight:600; }
  .state-hint { font-size:13px; color:var(--tg-theme-hint-color,#64748b); }
  .foot { margin-top:22px; text-align:center; }
  .refresh { background:var(--tg-theme-secondary-bg-color,#fff); color:var(--tg-theme-text-color,#1e293b);
    border:1px solid var(--tg-theme-hint-color,#e2e8f0); border-radius:9px; padding:8px 16px;
    font-size:14px; cursor:pointer; }
  .stamp { font-size:11px; color:var(--tg-theme-hint-color,#94a3b8); margin-top:8px; }
  .num { direction:ltr; unicode-bidi:embed; display:inline-block; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:20px; background:#10b981;
    color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .25s; z-index:99; }
  .toast.on { opacity:1; }
</style>
</head>
<body dir="rtl">
<div class="container">
  <div class="header-top">
    <div>
      <h1 id="title">💰 لوحة المحاسبة</h1>
      <div class="who-am-i" id="whoAmI"></div>
    </div>
    <button class="lang-switch" id="langBtn">EN</button>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab on" data-tab="home" id="tab-home"></div>
    <div class="tab" data-tab="income" id="tab-income"></div>
    <div class="tab" data-tab="expense" id="tab-expense"></div>
  </div>

  <div class="state on" id="loading">
    <div class="spinner"></div><div class="state-hint" id="loadingText">جاري التحميل…</div>
  </div>
  <div class="state" id="error">
    <div class="state-icon">⚠️</div><div class="state-text" id="errorText"></div>
  </div>

  <div id="content" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var BASE = "https://qrxiqqkzmtumcwjfqujq.supabase.co/functions/v1/dashboard";

  var STR = {
    ar: {
      title:"💰 لوحة المحاسبة", loading:"جاري التحميل…",
      openFromGroup:"افتح اللوحة من أمر /dashboard في المجموعة.",
      tabHome:"اللوحة", tabIncome:"الدخل", tabExpense:"المصروفات",
      pays:"يدفع لـ", allSquare:"لا توجد مستحقات", allSquareHint:"الحسابات متساوية.",
      st_pending:"⏳ قيد الانتظار", st_stripe:"💳 Stripe", st_bank:"🏦 البنك", st_paid:"🤝 تم التقسيم",
      entries:"عملية",
      waitingDays:function(d,n){ return "أقدم عملية: "+d+" من "+n+" أيام"; },
      dueOn:function(d){ return "متوقع "+d; },
      readyNow:function(n){ return n+" جاهزة للنقل"; },
      arrived:"وصلت — محسوبة في المستحقات",
      net:"الصافي", owes:"مدين لـ", settledHere:"لا مستحقات هنا",
      ownWork:function(a){ return "عمل "+a+" على حسابه"; },
      halfGoes:function(h,a,b){ return "النصف ("+h+") → "+a+" مدين لـ "+b; },
      shared:"مشترك", details:"تفاصيل", hide:"إخفاء",
      moveTo:function(s){ return "➡️ نقل الكل إلى "+s; },
      confirmMove:function(n,s){ return "نقل "+n+" عملية إلى "+s+"؟"; },
      moved:function(n){ return "تم نقل "+n+" عملية"; }, nothingMoved:"لا يوجد ما يُنقل",
      signNote:function(a){ return "سالب = مستحق لـ "+a+" · موجب = مستحق على "+a; },
      fPerson:"الشخص", fStage:"المرحلة", fMonth:"الشهر", fCurrency:"العملة",
      fPaidBy:"دفع بواسطة", fCategory:"الفئة", all:"الكل",
      total:"الإجمالي", count:"عدد العمليات",
      noRows:"لا توجد عمليات مطابقة",
      onAccount:function(w,a){ return w+" على حساب "+a; },
      ownAccount:function(w){ return w+" على حسابه"; },
      days:"يوم", refresh:"تحديث", updated:"آخر تحديث",
      payout:"أجر موظف", expense:"مصروف",
      splitEqual:"مناصفة", splitNone:"غير مشترك", splitTo:"على حساب",
      whoPaid:"من دفع", thName:"الشريك", thPaid:"دفع", thShare:"حصته", thBack:"له/عليه",
      errGeneric:"تعذّر تحميل اللوحة.", errNet:"تعذّر الوصول للخادم."
    },
    en: {
      title:"💰 Accounting dashboard", loading:"Loading…",
      openFromGroup:"Open this with /dashboard in the group.",
      tabHome:"Dashboard", tabIncome:"Income", tabExpense:"Expenses",
      pays:"pays", allSquare:"All square", allSquareHint:"Nothing is owed.",
      st_pending:"⏳ Pending", st_stripe:"💳 Stripe", st_bank:"🏦 Bank", st_paid:"🤝 Shared out",
      entries:"entries",
      waitingDays:function(d,n){ return "oldest waiting "+d+" of "+n+" days"; },
      dueOn:function(d){ return "due "+d; },
      readyNow:function(n){ return n+" ready to move"; },
      arrived:"arrived — counts as owed",
      net:"Net", owes:"owes", settledHere:"nothing owed here",
      ownWork:function(a){ return a+"'s own account"; },
      halfGoes:function(h,a,b){ return "half ("+h+") → "+a+" owes "+b; },
      shared:"shared", details:"details", hide:"hide",
      moveTo:function(s){ return "➡️ Move all to "+s; },
      confirmMove:function(n,s){ return "Move "+n+" entries to "+s+"?"; },
      moved:function(n){ return "Moved "+n+" entries"; }, nothingMoved:"Nothing to move",
      signNote:function(a){ return "negative = owed to "+a+" · positive = owed by "+a; },
      fPerson:"Person", fStage:"Stage", fMonth:"Month", fCurrency:"Currency",
      fPaidBy:"Paid by", fCategory:"Category", all:"All",
      total:"Total", count:"Entries",
      noRows:"No matching entries",
      onAccount:function(w,a){ return w+" on "+a+"'s account"; },
      ownAccount:function(w){ return w+"'s own account"; },
      days:"days", refresh:"Refresh", updated:"Updated",
      payout:"Payout", expense:"Expense",
      splitEqual:"50/50", splitNone:"not shared", splitTo:"charged to",
      whoPaid:"Who paid", thName:"Partner", thPaid:"Paid", thShare:"Share", thBack:"Owed back",
      errGeneric:"Could not load the dashboard.", errNet:"Could not reach the server."
    }
  };

  var lang="ar", T=STR.ar, D=null, tab="home", busy=false;
  var F = { person:"", stage:"", month:"", currency:"", paidBy:"", category:"" };
  var open = {};

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  function $(id){ return document.getElementById(id); }
  function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c;
    if(x!==undefined&&x!==null)n.textContent=String(x); return n; }
  function nm(x,c){ return el("span","num"+(c?" "+c:""),x); }
  function abs(n,cur){
    var v=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    return cur==="USD"?"$"+v:v+" EGP";
  }
  function money(n,cur){ return (n<0?"-":"")+abs(n,cur); }
  function signed(n,cur){ return (n<0?"-":"+")+abs(n,cur); }
  function sPlain(n){ return (n<0?"-":"+")+Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:2}); }
  function pair(p){
    var o=[];
    if(Math.abs(p.USD)>0.005)o.push(money(p.USD,"USD"));
    if(Math.abs(p.EGP)>0.005)o.push(money(p.EGP,"EGP"));
    return o.length?o.join(" · "):abs(0,"USD");
  }
  function dt(iso){
    var d=new Date(iso+"T12:00:00Z"); if(isNaN(d.getTime()))return iso;
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
  }
  function monthOf(iso){ return iso.slice(0,7); }
  function showOnly(id){
    ["loading","error"].forEach(function(s){ $(s).classList.toggle("on", s===id); });
    $("content").style.display = id==="content"?"block":"none";
    $("tabs").style.display = id==="content"?"flex":"none";
  }
  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on");
    setTimeout(function(){t.classList.remove("on");},2200); }
  function headers(){
    var h={};
    if(tg&&tg.initData)h["X-Telegram-Init-Data"]=tg.initData;
    var t=new URLSearchParams(location.search).get("t");
    if(t)h["X-Dashboard-Token"]=t;
    return h;
  }
  function sel(labelText,value,options,onChange){
    var wrap=el("label");
    wrap.appendChild(el("span","flabel",labelText));
    var s=el("select");
    options.forEach(function(o){
      var op=el("option",null,o[1]); op.value=o[0];
      if(o[0]===value)op.selected=true; s.appendChild(op);
    });
    s.onchange=function(){ onChange(s.value); };
    wrap.appendChild(s);
    return wrap;
  }

  // =================================================================== home
  function renderHome(c) {
    if (D.settlePlan.length) {
      D.settlePlan.forEach(function(s){
        var b=el("div","settle");
        b.appendChild(el("div","who", s.from+" "+T.pays+" "+s.to));
        var a=el("div","amt"); a.appendChild(nm(abs(s.amount,s.currency))); b.appendChild(a);
        c.appendChild(b);
      });
    } else {
      var n=el("div","settle none");
      n.appendChild(el("div","amt",T.allSquare));
      n.appendChild(el("div","who",T.allSquareHint));
      c.appendChild(n);
    }

    D.stages.forEach(function(st){
      var card=el("div","card");

      var head=el("div","st-head");
      head.appendChild(el("span","st-name",T["st_"+st.status]));
      head.appendChild(nm(pair(st.totals),"st-total"));
      card.appendChild(head);

      // how long it has been waiting, and when it is due
      var meta=[st.count+" "+T.entries];
      if (st.status==="bank") {
        meta.push(T.arrived);
      } else if (st.oldestDays!==null) {
        meta.push(T.waitingDays(st.oldestDays, D.stageDays));
        if (st.readyCount) meta.push(T.readyNow(st.readyCount));
        else if (st.nextDue) meta.push(T.dueOn(dt(st.nextDue)));
      }
      card.appendChild(el("div","st-meta",meta.join(" · ")));

      if (st.status!=="bank" && st.oldestDays!==null) {
        var track=el("div","track");
        var f=el("div","fill"+(st.readyCount?" ready":""));
        f.style.width=Math.min(100,(st.oldestDays/D.stageDays)*100)+"%";
        track.appendChild(f); card.appendChild(track);
      }

      // the net, in words, plus a details toggle
      var netRow=el("div","st-net");
      if (Math.abs(st.netBetween)<0.005) netRow.appendChild(el("span","muted",T.settledHere));
      else {
        var dr=st.netBetween>0?D.anchor:D.other, cr=st.netBetween>0?D.other:D.anchor;
        netRow.appendChild(el("span",null, dr+" "+T.owes+" "+cr+"  "+abs(st.netBetween,"USD")));
      }
      var tgl=el("button","toggle", open[st.status]?T.hide:T.details);
      netRow.appendChild(tgl);
      card.appendChild(netRow);

      var detail=el("div","detail"+(open[st.status]?" on":""));
      detail.appendChild(el("div","st-meta",T.signNote(D.anchor)));
      st.sections.forEach(function(s){
        var box=el("div","sec");
        var top=el("div","sec-top");
        var name=el("span","sec-name",s.person);
        if(s.kind==="employee")name.appendChild(el("span","badge",T.shared));
        top.appendChild(name);
        top.appendChild(nm(signed(s.net,s.currency),"sec-net "+(s.net<0?"pos":"neg")));
        box.appendChild(top);
        box.appendChild(nm(s.entries.map(function(e){return sPlain(e.signed||e.amount);}).join("   "),"sec-nums"));
        var mean;
        if(s.kind==="own") mean=T.ownWork(s.person);
        else if(s.kind==="employee"&&s.debtor) mean=T.halfGoes(abs(s.debtAmount,s.currency),s.debtor,s.creditor);
        else if(s.debtor) mean=s.debtor+" "+T.owes+" "+s.creditor+"  "+abs(s.debtAmount,s.currency);
        else mean=T.settledHere;
        box.appendChild(el("div","sec-mean",mean));
        detail.appendChild(box);
      });
      card.appendChild(detail);
      tgl.onclick=function(){
        open[st.status]=!open[st.status];
        detail.classList.toggle("on",open[st.status]);
        tgl.textContent=open[st.status]?T.hide:T.details;
      };

      if (st.status!=="paid") {
        var nextLabel = st.status==="pending"?T.st_stripe : st.status==="stripe"?T.st_bank : T.st_paid;
        var btn=el("button","move"+(st.readyCount||st.status==="bank"?" ready":""),T.moveTo(nextLabel));
        btn.onclick=function(){ move(st.status,nextLabel,st.count,btn); };
        card.appendChild(btn);
      }
      c.appendChild(card);
    });
  }

  // ================================================================ income
  function renderIncome(c) {
    var months = [...new Set(D.incomes.map(function(r){return monthOf(r.date);}))].sort().reverse();
    var f=el("div","filters");
    f.appendChild(sel(T.fPerson, F.person,
      [["",T.all]].concat(D.people.map(function(p){return [p,p];})),
      function(v){ F.person=v; draw(); }));
    f.appendChild(sel(T.fStage, F.stage,
      [["",T.all],["pending",T.st_pending],["stripe",T.st_stripe],["bank",T.st_bank],["paid",T.st_paid]],
      function(v){ F.stage=v; draw(); }));
    f.appendChild(sel(T.fMonth, F.month,
      [["",T.all]].concat(months.map(function(m){return [m,m];})),
      function(v){ F.month=v; draw(); }));
    c.appendChild(f);

    var rows = D.incomes.filter(function(r){
      if(F.person && r.earner!==F.person && r.account!==F.person) return false;
      if(F.stage && r.status!==F.stage) return false;
      if(F.month && monthOf(r.date)!==F.month) return false;
      return true;
    });

    var tot={USD:0,EGP:0};
    rows.forEach(function(r){ tot[r.currency]+=r.amount; });
    var sum=el("div","sumline");
    sum.appendChild(el("span",null,T.total+" · "+rows.length+" "+T.entries));
    sum.appendChild(nm(pair(tot)));
    c.appendChild(sum);

    if(!rows.length){ c.appendChild(el("div","card muted",T.noRows)); return; }

    var card=el("div","card");
    rows.forEach(function(r){
      var row=el("div","row"), left=el("div");
      left.appendChild(nm(abs(r.amount,r.currency),"r-main"));
      var who = r.earner===r.account ? T.ownAccount(r.earner) : T.onAccount(r.earner,r.account);
      var bits=[who, dt(r.date)];
      if(r.description)bits.push(r.description);
      left.appendChild(el("div","r-sub",bits.join(" · ")));
      row.appendChild(left);

      var right=el("div","r-right");
      var ready = r.daysInStage!==null && r.daysInStage>=D.stageDays;
      right.appendChild(el("span","chip"+(ready?" ready":""),T["st_"+r.status]));
      if(r.daysInStage!==null){
        right.appendChild(el("div","r-sub", r.daysInStage+" "+T.days));
      }
      row.appendChild(right);
      card.appendChild(row);
    });
    c.appendChild(card);
  }

  // =============================================================== expenses
  function renderExpense(c) {
    var months = [...new Set(D.expenses.map(function(r){return monthOf(r.date);}))].sort().reverse();
    var payers = [...new Set(D.expenses.map(function(r){return r.paidBy;}))].sort();
    var f=el("div","filters");
    f.appendChild(sel(T.fPaidBy, F.paidBy,
      [["",T.all]].concat(payers.map(function(p){return [p,p];})),
      function(v){ F.paidBy=v; draw(); }));
    f.appendChild(sel(T.fCategory, F.category,
      [["",T.all]].concat(D.categories.map(function(x){return [x,x];})),
      function(v){ F.category=v; draw(); }));
    f.appendChild(sel(T.fCurrency, F.currency,
      [["",T.all],["EGP","EGP"],["USD","USD"]],
      function(v){ F.currency=v; draw(); }));
    f.appendChild(sel(T.fMonth, F.month,
      [["",T.all]].concat(months.map(function(m){return [m,m];})),
      function(v){ F.month=v; draw(); }));
    c.appendChild(f);

    var rows = D.expenses.filter(function(r){
      if(F.paidBy && r.paidBy!==F.paidBy) return false;
      if(F.category && r.category!==F.category) return false;
      if(F.currency && r.currency!==F.currency) return false;
      if(F.month && monthOf(r.date)!==F.month) return false;
      return true;
    });

    var tot={USD:0,EGP:0};
    rows.forEach(function(r){ tot[r.currency]+=r.amount; });
    var sum=el("div","sumline");
    sum.appendChild(el("span",null,T.total+" · "+rows.length+" "+T.entries));
    sum.appendChild(nm(pair(tot)));
    c.appendChild(sum);

    if(rows.length){
      var card=el("div","card");
      rows.forEach(function(r){
        var row=el("div","row"), left=el("div");
        left.appendChild(nm(abs(r.amount,r.currency),"r-main"));
        var split = r.split==="founders_equal" ? T.splitEqual
          : r.split==="charged_to" ? T.splitTo+" "+r.chargeTo : T.splitNone;
        var bits=[r.paidBy, dt(r.date), split];
        if(r.category)bits.push(r.category);
        left.appendChild(el("div","r-sub",bits.join(" · ")));
        if(r.description)left.appendChild(el("div","r-sub",r.description));
        row.appendChild(left);
        row.appendChild(el("span","chip", r.kind==="payout"?T.payout:T.expense));
        card.appendChild(row);
      });
      c.appendChild(card);
    } else {
      c.appendChild(el("div","card muted",T.noRows));
    }

    // who paid vs who owes it back
    if(D.expenseSplit.length){
      c.appendChild(el("div","title-sm",T.whoPaid));
      ["EGP","USD"].forEach(function(cur){
        var rs=D.expenseSplit.filter(function(p){
          return Math.abs(p.paid[cur])>0.005||Math.abs(p.share[cur])>0.005;
        });
        if(!rs.length)return;
        var card=el("div","card");
        card.appendChild(el("div","flabel",cur));
        var t=el("table"), h=el("tr");
        [T.thName,T.thPaid,T.thShare,T.thBack].forEach(function(x){h.appendChild(el("th",null,x));});
        t.appendChild(h);
        rs.forEach(function(p){
          var tr=el("tr");
          tr.appendChild(el("td",null,p.name));
          var a=el("td"); a.appendChild(nm(abs(p.paid[cur],cur))); tr.appendChild(a);
          var b=el("td","muted"); b.appendChild(nm(abs(p.share[cur],cur))); tr.appendChild(b);
          var n=el("td"); n.appendChild(nm(signed(p.net[cur],cur), p.net[cur]>=0?"pos":"neg")); tr.appendChild(n);
          t.appendChild(tr);
        });
        card.appendChild(t); c.appendChild(card);
      });
    }
  }

  // ================================================================== draw
  function draw() {
    if(!D) return;
    document.documentElement.lang=lang;
    document.documentElement.dir = lang==="ar"?"rtl":"ltr";
    document.body.dir = lang==="ar"?"rtl":"ltr";
    $("title").textContent=T.title;
    $("langBtn").textContent = lang==="ar"?"EN":"ع";
    $("whoAmI").textContent=D.me.name;
    $("tab-home").textContent=T.tabHome;
    $("tab-income").textContent=T.tabIncome;
    $("tab-expense").textContent=T.tabExpense;
    ["home","income","expense"].forEach(function(k){
      $("tab-"+k).classList.toggle("on", tab===k);
    });
    showOnly("content");

    var c=$("content"); c.textContent="";
    if(tab==="home") renderHome(c);
    else if(tab==="income") renderIncome(c);
    else renderExpense(c);

    var foot=el("div","foot");
    var rb=el("button","refresh",T.refresh); rb.onclick=load; foot.appendChild(rb);
    foot.appendChild(el("div","stamp",T.updated+" "+new Date(D.generatedAt).toLocaleTimeString()));
    c.appendChild(foot);
  }

  function move(from,label,count,btn){
    if(busy)return;
    var ask=T.confirmMove(count,label);
    function go(){
      busy=true; btn.disabled=true;
      fetch(BASE+"/advance",{
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"},headers()),
        body:JSON.stringify({from:from})
      }).then(function(r){ return r.json().then(function(j){return {ok:r.ok,body:j};}); })
        .then(function(res){
          busy=false;
          if(!res.ok){ btn.disabled=false; return fail(res.body.error||T.errGeneric); }
          toast(res.body.moved?T.moved(res.body.moved):T.nothingMoved);
          D=res.body; draw();
        }).catch(function(){ busy=false; btn.disabled=false; fail(T.errNet); });
    }
    if(tg&&tg.showConfirm) tg.showConfirm(ask,function(ok){ if(ok)go(); });
    else if(window.confirm(ask)) go();
  }

  function fail(m){ $("errorText").textContent=m; showOnly("error"); }

  function load(){
    showOnly("loading"); $("loadingText").textContent=T.loading;
    var h=headers();
    if(!h["X-Dashboard-Token"]&&!h["X-Telegram-Init-Data"]) return fail(T.openFromGroup);
    fetch(BASE+"/data",{headers:h,cache:"no-store"})
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,body:j};}); })
      .then(function(res){
        if(!res.ok) return fail(res.body.error||T.errGeneric);
        D=res.body; draw();
      }).catch(function(){ fail(T.errNet); });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(el2){
    el2.onclick=function(){ tab=el2.getAttribute("data-tab"); F.person=F.stage=F.month=F.currency=F.paidBy=F.category=""; draw(); };
  });
  $("langBtn").onclick=function(){
    lang = lang==="ar"?"en":"ar"; T=STR[lang];
    if(D)draw(); else load();
  };

  load();
})();
</script>
</body>
</html>
